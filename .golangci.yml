version: 2

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - migrations

linters-settings:
  goimports:
    local-prefixes: pr-reviewer-service
  
  govet:
    check-shadowing: true
  
  errcheck:
    check-type-assertions: true
    check-blank: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0