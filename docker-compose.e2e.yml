
services:
  postgres_e2e:
    image: postgres:15-alpine
    container_name: pr-reviewer-db-e2e
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user"]
      interval: 2s
      timeout: 5s
      retries: 10
  
  migrate_e2e:
    image: migrate/migrate:latest
    container_name: pr-reviewer-migrate-e2e
    command: -path=/migrations -database "postgres://test_user:test_password@postgres_e2e:5432/test_db?sslmode=disable" up
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres_e2e:
        condition: service_healthy

  app_e2e:
    build: .
    container_name: pr-reviewer-app-e2e
    ports:
      - "8081:8080"
    depends_on:
      postgres_e2e:
        condition: service_healthy
      migrate_e2e:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres_e2e
      DB_PORT: 5432
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_NAME: test_db
      DB_SSLMODE: disable
      PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/statistics 2>&1 | grep -q '200 OK' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

